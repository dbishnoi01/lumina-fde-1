# Render blueprint — one free-tier web service running the whole LUMINA backend.
# Connect this repo as a Blueprint in the Render dashboard; it reads this file.
# The UI is NOT here — it deploys to Vercel and is the graded submission URL.
#
# Secrets (sync: false) are set once in the Render dashboard, never committed.
# Non-secret config is pinned here so a deploy is reproducible.
services:
  - type: web
    name: lumina-backend
    runtime: node
    plan: free
    region: oregon
    # web/ is skipped on purpose — the UI ships to Vercel, not here.
    buildCommand: >-
      npm ci &&
      npm run build -w @lumina/contract &&
      npm run build -w @lumina/agent &&
      npm run build -w @lumina/gateway
    startCommand: node render-start.mjs
    healthCheckPath: /health
    envVars:
      # ---- Runtime / wiring (the supervisor also sets these per-child; kept here for clarity) ----
      - key: NODE_VERSION
        value: 20.19.0
      - key: AGENT_URL
        value: http://127.0.0.1:8000
      - key: AGENT_HOST
        value: 127.0.0.1
      - key: AGENT_RUN_WORKER
        value: "1"
      - key: LOG_LEVEL
        value: info

      # ---- MongoDB Atlas (M0) ----
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: lumina
      - key: VECTOR_BACKEND
        value: atlas-vector-search

      # ---- LLM: Groq (OpenAI-compatible) ----
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: GROQ_API_KEY
        sync: false
      # Fallback when Groq hits its free daily token cap (429): retry on Gemini's
      # OpenAI-compatible endpoint, reusing GEMINI_API_KEY below. Only a rate-limit trips it.
      - key: LLM_FALLBACK_ENABLED
        value: "true"
      - key: GEMINI_CHAT_MODEL
        value: gemini-2.0-flash

      # ---- Embeddings: Gemini (1536-d) ----
      - key: EMBEDDING_PROVIDER
        value: gemini
      - key: EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: GEMINI_API_KEY
        sync: false

      # ---- Web search: Tavily ----
      - key: SEARCH_PROVIDER
        value: tavily
      - key: TAVILY_API_KEY
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
      - key: SEARCH_CACHE_TTL_SECONDS
        value: "21600"

      # ---- Deep-search gates + hard caps (enforced in the agent) ----
      - key: DEEP_SUB_QUESTIONS_MIN
        value: "3"
      - key: DEEP_SUB_QUESTIONS_MAX
        value: "6"
      - key: DEEP_DAILY_CAP
        value: "5"
      - key: MAX_TOOL_CALLS
        value: "8"
      - key: MAX_WALL_CLOCK_SEC
        value: "90"
      - key: MAX_TOOL_CALLS_DEEP
        value: "24"
      - key: MAX_WALL_CLOCK_SEC_DEEP
        value: "240"

      # ---- Gateway public surface ----
      # Per-user fixed-window ceiling. 30 was too low for a real research session (many
      # threads + polls in a minute) and for the eval's legitimate burst (contract probes +
      # smoke + ingest polls + gold + stats as one user), which self-inflicted 429s. The
      # 429 feature still exists — this only lifts the ceiling to a workload-realistic level.
      - key: RATE_LIMIT_PER_MINUTE
        value: "600"
      # Set to your Vercel URL (comma-separated for more than one), e.g.
      #   https://lumina-<you>.vercel.app
      - key: CORS_ORIGINS
        sync: false
